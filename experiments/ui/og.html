<!-- Source of web/og.png (1200x630): og_sketch.png = experiments/hand-sketches/sketches/02_l_bracket.png, og_part.png = a screenshot of the 3D view of the L-bracket example. -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#f3efe4;font-family:"IBM Plex Sans",sans-serif;color:#1d2733;
background-image:linear-gradient(rgba(29,39,51,.085) 1px,transparent 1px),linear-gradient(90deg,rgba(29,39,51,.085) 1px,transparent 1px),linear-gradient(rgba(29,39,51,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(29,39,51,.045) 1px,transparent 1px);background-size:100px 100px,100px 100px,10px 10px,10px 10px;}
.frame{position:absolute;inset:28px;border:2px solid #1d2733;background:#faf8f1;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:18px;padding:22px 30px;border-bottom:2px solid #1d2733}
.mark{width:44px;height:44px;border:2px solid #1d2733;position:relative;flex:none}
.mark:before{content:"";position:absolute;left:7px;right:7px;top:25px;border-top:2px solid #1d2733}
.mark:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#d4441c;left:15px;top:9px}
.name{font:600 15px "IBM Plex Mono";letter-spacing:.3em;color:#4b5664}
.tag{font-size:38px;line-height:1.1;margin-top:4px;letter-spacing:-.01em}
.body{flex:1;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;padding:20px 30px 18px}
.card{background:#fff;border:1.5px solid #1d2733;height:330px;display:grid;place-items:center;overflow:hidden;position:relative}
.card img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.lab{z-index:2;position:absolute;left:10px;top:8px;font:600 13px "IBM Plex Mono";letter-spacing:.14em;color:#4b5664;background:#fff;padding:2px 4px}
.arrow{text-align:center;font:600 40px "IBM Plex Mono";color:#d4441c}
.foot{padding:0 30px 18px;font:500 16px "IBM Plex Mono";color:#4b5664;display:flex;justify-content:space-between}
.foot b{color:#d4441c;font-weight:600}
</style></head><body><div class="frame">
<div class="head"><span class="mark"></span><div><div class="name">HEPHAESTUS</div><div class="tag">Sketch it. Get a verified, editable CAD part.</div></div></div>
<div class="body"><div class="card"><span class="lab">YOUR SKETCH</span><img src="og_sketch.png"></div><div class="arrow">→</div>
<div class="card"><span class="lab">PARAMETRIC PART · STEP / STL</span><img src="og_part.png"></div></div>
<div class="foot"><span>read → build → <b>verify</b> → fix, until it matches</span><span>Muse Spark · SAM 3.1 · Muse Voice</span></div>
</div></body></html>
